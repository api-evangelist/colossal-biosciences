aid: colossal-biosciences
name: Colossal Biosciences
description: 'Colossal Biosciences is a Dallas, Texas based de-extinction and species-preservation
  biotechnology company founded in 2021 by Ben Lamm and Harvard geneticist George Church.
  It applies ancient-DNA sequencing, comparative genomics, CRISPR multiplex genome editing,
  cloning and artificial-womb research to restoring extinct keystone species — the woolly
  mammoth, thylacine, dodo, moa, dire wolf and blue buck among them — and to conserving
  critically endangered living species. Colossal spun out the computational life-sciences
  platform Form Bio, runs the non-profit Colossal Foundation, and publishes its research
  code through the colossal-compsci GitHub organization. Colossal publishes no product or
  developer API; the machine-readable surface on colossal.com is the WordPress REST API
  (wp/v2) that serves the company newsroom, pages, media and site search as JSON, plus a
  WordPress MCP Adapter endpoint that is present but authentication-gated.'
