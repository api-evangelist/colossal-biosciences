apis:
- aid: colossal-biosciences:mcp
  name: Colossal Biosciences MCP Server (WordPress MCP Adapter)
  description: >-
    A Model Context Protocol server endpoint advertised in the colossal.com WordPress REST route index
    under the "mcp" namespace and served at /wp-json/mcp/mcp-adapter-default-server. The endpoint is live
    but authentication-gated: an anonymous JSON-RPC tools/list returns HTTP 401 rest_forbidden, as does
    the companion wp-abilities/v1 abilities registry, so the published tool set could not be enumerated.
  humanURL: https://colossal.com/wp-json/mcp
  baseURL: https://colossal.com/wp-json/mcp/mcp-adapter-default-server
