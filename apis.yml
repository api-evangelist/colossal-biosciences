apis:
- aid: colossal-biosciences:content
  name: Colossal Biosciences Content API (WordPress REST wp/v2)
  description: 'The anonymously readable WordPress REST API that colossal.com serves at
    /wp-json/wp/v2 — newsroom posts, marketing pages, the media library, categories, tags,
    comments, users and a site-wide search endpoint, all as JSON with page/per_page
    pagination and X-WP-Total / X-WP-TotalPages headers. This is the CMS content API, not a
    Colossal product API; Colossal publishes no OpenAPI for it, so the definition in this
    repo was derived mechanically from the live route-discovery document at
    https://colossal.com/wp-json/.'
  humanURL: https://colossal.com/news/
  baseURL: https://colossal.com/wp-json/wp/v2
